networks:
  bpm-net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  keycloak_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
  db_backups:
  minio_backups:

# Default container log rotation (json-file). Without this Docker keeps an
# unbounded *-json.log per container and eventually fills the disk. Applied to
# every long-running service below via `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-common-env: &common-env
  DATABASE_URL: postgres://bpm:${POSTGRES_PASSWORD}@postgres:5432/bpm_db
  KAFKA_BROKERS: kafka:9092
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: bpm
  KEYCLOAK_CLIENT_ID: bpm-backend
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
  JWT_PUBLIC_KEY_URL: http://keycloak:8080/realms/bpm/protocol/openid-connect/certs
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: bpm-attachments
  NODE_ENV: production
  LOG_LEVEL: info

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: bpm-postgres
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # ports: internal-only   # 5432 postgres (use docker exec)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./db/seeds:/docker-entrypoint-initdb.d/seeds:ro
      - ./db/seeds-demo:/docker-entrypoint-initdb.d/seeds-demo:ro
    environment:
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bpm_db
      # Demo data loads only when true. PRODUCTION: leave false for a clean DB.
      LOAD_DEMO_SEEDS: ${LOAD_DEMO_SEEDS:-false}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm -d bpm_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: bpm-kafka
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # ports: external listeners not published (internal kafka:9092 only)
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      # KRaft mode — no Zookeeper
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bpm-kafka-ui
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # Also reachable at /kafka-ui/ via the edge proxy (basic-auth protected)
    # when that overlay is used. BIND_ADDR=127.0.0.1 in production locks this
    # direct port to loopback, same as everything else.
    ports: ["${BIND_ADDR:-0.0.0.0}:8091:8080"]
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
      KAFKA_CLUSTERS_0_NAME: bpm-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: bpm-minio
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # Console (9001) also reachable at /minio/ via the edge proxy when that
    # overlay is used. BIND_ADDR=127.0.0.1 in production locks these direct
    # ports to loopback, same as everything else.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:9000:9000"
      - "${BIND_ADDR:-0.0.0.0}:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: bpm-minio-init
    networks: [bpm-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/bpm-attachments;
      mc anonymous set none local/bpm-attachments;
      echo 'MinIO bucket ready (private — all downloads go through presigned URLs)';
      "

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bpm-keycloak
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # Also reachable at /realms/ /resources/ /admin/ /js/ via the edge proxy
    # when that overlay is used (same-origin as the frontend at the edge
    # port). BIND_ADDR=127.0.0.1 in production locks this direct port to
    # loopback, same as everything else.
    ports: ["${BIND_ADDR:-0.0.0.0}:8443:8080"]
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Run ./keycloak/render-realm.sh first (any time KEYCLOAK_CLIENT_SECRET
      # or KC_FRONTEND_URL below changes) to produce this file from
      # realm-export.json.template — Keycloak's own --import-realm does NOT
      # substitute ${VAR} placeholders itself, so the committed template is
      # never mounted directly.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak-themes:/opt/keycloak/themes:ro
    environment:
      KC_DB: dev-file
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Must match the value baked into realm-export.json by render-realm.sh
      # (confidential client secret + the frontend redirect origin — replaces
      # the old hardcoded secret / '*'). Re-run render-realm.sh after changing.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET must be set}
      # Public origin: the direct port (default) for local dev without edge, or
      # the edge proxy's origin/port (e.g. https://host:8093) when deployed
      # behind edge — set both KC_FRONTEND_URL and KC_HOSTNAME_PORT to match.
      KC_FRONTEND_URL: ${KC_FRONTEND_URL:-http://localhost:8443}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8443}
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "(echo >/dev/tcp/localhost/8080) 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ─── Backend Services ─────────────────────────────────────────────────────

  org-service:
    build:
      context: ../services/org-service
      dockerfile: Dockerfile
    container_name: bpm-org-service
    image: ${REGISTRY:-bpm}/org-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # ports: internal-only (via api-gateway)   # 3001 org-service
    environment:
      <<: *common-env
      PORT: "3001"
      SERVICE_NAME: org-service
      # Keycloak admin creds for user provisioning (was silently defaulting before).
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  approval-service:
    build:
      context: ../services/approval-service
      dockerfile: Dockerfile
    container_name: bpm-approval-service
    image: ${REGISTRY:-bpm}/approval-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # ports: internal-only (via api-gateway)   # 3002 approval-service
    environment:
      <<: *common-env
      PORT: "3002"
      SERVICE_NAME: approval-service
      ORG_SERVICE_URL: http://org-service:3001
      # C2 — let approval decisions flow back to the linked case + process
      CASE_SERVICE_URL: http://case-service:3004
      BPM_ORCHESTRATOR_URL: http://bpm-orchestrator:3003
    depends_on:
      postgres:
        condition: service_healthy
      org-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  bpm-orchestrator:
    build:
      context: ../services/bpm-orchestrator
      dockerfile: Dockerfile
    container_name: bpm-orchestrator
    image: ${REGISTRY:-bpm}/orchestrator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # Normally internal-only (reached via api-gateway). Exposed here so
    # Playwright's backend-workflow project can call orchestrator-only routes
    # that api-gateway doesn't proxy (e.g. the approval-service -> orchestrator
    # approval-result callback), the same way external-api is exposed below.
    # BIND_ADDR=127.0.0.1 in production locks this to loopback like everything else.
    ports: ["${BIND_ADDR:-0.0.0.0}:3003:3003"]
    environment:
      <<: *common-env
      PORT: "3003"
      SERVICE_NAME: bpm-orchestrator
      ORG_SERVICE_URL: http://org-service:3001
      APPROVAL_SERVICE_URL: http://approval-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      SMTP_HOST: ${SMTP_HOST}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-false}
      RETENTION_ARCHIVE_AFTER_DAYS: ${RETENTION_ARCHIVE_AFTER_DAYS:-120}
      RETENTION_DELETE_AFTER_DAYS: ${RETENTION_DELETE_AFTER_DAYS:-180}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  case-service:
    build:
      context: ../services/case-service
      dockerfile: Dockerfile
    container_name: bpm-case-service
    image: ${REGISTRY:-bpm}/case-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # ports: internal-only (via api-gateway)   # 3004 case-service
    environment:
      <<: *common-env
      PORT: "3004"
      SERVICE_NAME: case-service
      ORG_SERVICE_URL: http://org-service:3001
      APPROVAL_SERVICE_URL: http://approval-service:3002
      BPM_ORCHESTRATOR_URL: http://bpm-orchestrator:3003
      # C1 — auto-start the orchestrating process for incident/change/request cases
      CASE_AUTO_PROCESS: "request,change"   # selective: only workflow types auto-start a process; incidents/faults/etc. are plain cases
      # Public-facing endpoint for presigned attachment DOWNLOAD URLs only —
      # unlike MINIO_ENDPOINT above (internal `minio` hostname, used for
      # upload), this becomes part of a URL handed to a real browser (R-22).
      # Defaults to the internal values (unset here) so local dev is
      # unaffected. In production, set to the edge proxy's public domain —
      # e.g. MINIO_PUBLIC_ENDPOINT=bpm.example.com, MINIO_PUBLIC_PORT=443,
      # MINIO_PUBLIC_USE_SSL=true — which infra/edge/nginx.conf forwards to
      # MinIO's S3 API port.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      approval-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  integration-hub:
    build:
      context: ../services/integration-hub
      dockerfile: Dockerfile
    container_name: bpm-integration-hub
    image: ${REGISTRY:-bpm}/integration-hub:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # ports: internal-only (via api-gateway)   # 3005 integration-hub
    environment:
      <<: *common-env
      PORT: "3005"
      SERVICE_NAME: integration-hub
      CASE_SERVICE_URL: http://case-service:3004
      # ── Alarm Ingestion ─────────────────────────────────────────────────
      # Webhook tokens (set to a secret value in production)
      ZABBIX_WEBHOOK_TOKEN: ${ZABBIX_WEBHOOK_TOKEN}
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN}
      GRAFANA_WEBHOOK_TOKEN: ${GRAFANA_WEBHOOK_TOKEN}
      # Dedup
      ALARM_DEDUP_TTL_SECONDS: "900"
      ALARM_MIN_SEVERITY_TO_TICKET: "high"
      # PRIORITY_MAPPING_JSON: '{"critical":"P1","high":"P2","warning":"P3","info":"P4","unknown":"P5"}'
      # MDM Enrichment
      MDM_ENRICHMENT_ENABLED: "true"
      MDM_ENRICHMENT_MODE: "async"
      MDM_BASE_URL: ""
      MDM_API_KEY: ${MDM_API_KEY}
      MDM_TIMEOUT_MS: "500"
      MDM_CACHE_TTL_SECONDS: "1800"
      MDM_FAIL_OPEN: "true"
      # SLA
      SLA_ENABLED: "true"
      SLA_DEFAULT_TIMEZONE: "UTC"
      SLA_UPDATE_INTERVAL_SECONDS: "60"
      SLA_AT_RISK_THRESHOLD_PERCENT: "20"
      SLA_CALENDAR_PROVIDER: "mdm"
      SLA_FAIL_OPEN: "true"
      # Ops
      ALARM_DRY_RUN: "false"
      DEFAULT_TENANT_ID: "a0000000-0000-0000-0000-000000000001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: bpm-notification-service
    image: ${REGISTRY:-bpm}/notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # ports: internal-only (via api-gateway)   # 3006 notification-service
    environment:
      <<: *common-env
      PORT: "3006"
      SERVICE_NAME: notification-service
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: bpm-api-gateway
    image: ${REGISTRY:-bpm}/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    ports: ["${BIND_ADDR:-0.0.0.0}:3000:3000"]
    environment:
      <<: *common-env
      PORT: "3000"
      SERVICE_NAME: api-gateway
      ORG_SERVICE_URL: http://org-service:3001
      APPROVAL_SERVICE_URL: http://approval-service:3002
      BPM_ORCHESTRATOR_URL: http://bpm-orchestrator:3003
      CASE_SERVICE_URL: http://case-service:3004
      INTEGRATION_HUB_URL: http://integration-hub:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    depends_on:
      org-service:
        condition: service_healthy
      approval-service:
        condition: service_healthy
      bpm-orchestrator:
        condition: service_healthy
      case-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Frontend ─────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ../apps/frontend-portal
      dockerfile: Dockerfile
      args:
        # Build-time URLs. Default (no edge): frontend's own direct port +
        # api-gateway's own direct port. Deployed behind edge instead: point
        # both at the edge origin (e.g. https://host:8093) — the edge proxy
        # serves the app, API, and Keycloak same-origin from that one port.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-bpm}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-bpm-frontend}
    container_name: bpm-frontend
    image: ${REGISTRY:-bpm}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # Also reachable at / via the edge proxy when that overlay is used.
    # BIND_ADDR=127.0.0.1 in production locks this direct port to loopback.
    ports: ["${BIND_ADDR:-0.0.0.0}:8080:80"]
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── External Contractor Services ─────────────────────────────────────────

  external-api:
    build:
      context: ../services/external-api
      dockerfile: Dockerfile
    container_name: bpm-external-api
    image: ${REGISTRY:-bpm}/external-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # Normally internal-only (via contractor-frontend nginx). Exposed here so
    # the contractor API can be hit directly for local dev / Playwright without
    # going through the contractor-frontend proxy. BIND_ADDR=127.0.0.1 in
    # production locks this to loopback like everything else.
    ports: ["${BIND_ADDR:-0.0.0.0}:3007:3007"]
    environment:
      <<: *common-env
      PORT: "3007"
      SERVICE_NAME: external-api
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "8h"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: "bpm-attachments"
      CASE_SERVICE_URL: http://case-service:3004
      # Public-facing endpoint for presigned attachment DOWNLOAD URLs (R-22)
      # — contractor-portal's own public domain (external-api sits behind
      # contractor-portal's nginx, not the shared edge proxy), which forwards
      # the bucket path to MinIO's S3 API — see apps/contractor-portal/nginx.conf.
      # Defaults to the internal values (unset here) so local dev is unaffected.
      MINIO_PUBLIC_ENDPOINT: ${EXTERNAL_MINIO_PUBLIC_ENDPOINT:-}
      MINIO_PUBLIC_PORT: ${EXTERNAL_MINIO_PUBLIC_PORT:-}
      MINIO_PUBLIC_USE_SSL: ${EXTERNAL_MINIO_PUBLIC_USE_SSL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3007/api/ext/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  contractor-frontend:
    build:
      context: ../apps/contractor-portal
      dockerfile: Dockerfile
    container_name: bpm-contractor-frontend
    image: ${REGISTRY:-bpm}/contractor-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8081:80"
    depends_on:
      external-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mobile-pwa:
    build:
      context: ../apps/mobile-pwa
      dockerfile: Dockerfile
    container_name: bpm-mobile-pwa
    image: ${REGISTRY:-bpm}/mobile-pwa:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8082:80"
    depends_on:
      api-gateway:
        condition: service_started
      external-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Monitoring ───────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: bpm-prometheus
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # Also reachable at /prometheus/ via the edge proxy — see
    # docker-compose.edge.yml, which layers in --web.route-prefix for that
    # overlay only (kept out of this base command so the direct port below
    # keeps serving at root for local dev without edge).
    ports: ["${BIND_ADDR:-0.0.0.0}:9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:10.3.1
    container_name: bpm-grafana
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # Also reachable at /grafana/ via the edge proxy (Grafana's own login,
    # no basic auth stacked in front) — see docker-compose.edge.yml, which
    # layers in GF_SERVER_ROOT_URL/SERVE_FROM_SUB_PATH for that overlay only.
    ports: ["${BIND_ADDR:-0.0.0.0}:3300:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro_2024}

  # ─── Log aggregation (Loki + Promtail) ────────────────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: bpm-loki
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    # ports: internal-only (queried by Grafana)   # 3100 loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s

  promtail:
    image: grafana/promtail:2.9.8
    container_name: bpm-promtail
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: bpm-alertmanager
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    ports: ["${BIND_ADDR:-0.0.0.0}:9094:9093"]   # Alertmanager UI on host :9094
    volumes:
      - ./monitoring/alertmanager/alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ALERTS_EMAIL_TO: ${ALERTS_EMAIL_TO}
    # Render the template from env (secret → file) then start Alertmanager.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$SMTP_PASSWORD" > /tmp/smtp_password
        sed -e "s|@SMARTHOST@|$$SMTP_HOST:$$SMTP_PORT|" \
            -e "s|@FROM@|$$SMTP_FROM|" \
            -e "s|@USER@|$$SMTP_USER|" \
            -e "s|@TO@|$$ALERTS_EMAIL_TO|" \
            /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager

  # ─── Migrations (one-shot; run on deploy) ─────────────────────────────────
  # Usage: docker compose run --rm db-migrate           # apply pending
  #        docker compose run --rm db-migrate sh /migrate.sh status
  db-migrate:
    image: postgres:16-alpine
    container_name: bpm-db-migrate
    profiles: ["tools"]          # never starts on `up`; only when invoked
    networks: [bpm-net]
    environment:
      PGHOST: postgres
      PGUSER: bpm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: bpm_db
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Backups ──────────────────────────────────────────────────────────────
  db-backup:
    image: postgres:16-alpine
    container_name: bpm-db-backup
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    environment:
      PGHOST: postgres
      PGUSER: bpm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: bpm_db
      # Also backs up the Keycloak Postgres store when present (production
      # overlay only — see backup.sh). Matches KC_DB_NAME used by keycloak
      # itself in docker-compose.prod.yml; harmless if unset (defaults to
      # "keycloak") or if that database doesn't exist (dev-file mode locally).
      KC_DB_NAME: ${KC_DB_NAME:-keycloak}
      BACKUP_INTERVAL_SECONDS: "21600"   # every 6h
      BACKUP_KEEP: "14"
    volumes:
      - ./db/backup.sh:/backup.sh:ro
      - db_backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Mirrors the bpm-attachments bucket to a separate volume, independent of
  # minio_data — a database backup alone does not include attachment bytes.
  # See infra/db/minio-backup.sh.
  minio-backup:
    image: minio/mc:latest
    container_name: bpm-minio-backup
    restart: unless-stopped
    logging: *default-logging
    networks: [bpm-net]
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: bpm-attachments
      MINIO_BACKUP_INTERVAL_SECONDS: "21600"   # every 6h, matches db-backup
    volumes:
      - ./db/minio-backup.sh:/minio-backup.sh:ro
      - minio_backups:/backups
    entrypoint: ["/bin/sh", "/minio-backup.sh"]
    depends_on:
      minio:
        condition: service_healthy
