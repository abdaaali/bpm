apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # Read-only app DB access for the Administration dashboard (DB size, table
  # growth, cases-by-status, retention runs). Uses the grafana_ro role created
  # in migration 038 — SELECT only.
  - name: PostgreSQL
    type: postgres
    uid: bpmpg
    access: proxy
    url: postgres:5432
    database: bpm_db
    user: grafana_ro
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    editable: true
