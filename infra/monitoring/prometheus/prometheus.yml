global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:3000"]
    metrics_path: /metrics

  - job_name: org-service
    static_configs:
      - targets: ["org-service:3001"]
    metrics_path: /metrics

  - job_name: approval-service
    static_configs:
      - targets: ["approval-service:3002"]
    metrics_path: /metrics

  - job_name: bpm-orchestrator
    static_configs:
      - targets: ["bpm-orchestrator:3003"]
    metrics_path: /metrics

  # These services use a global '/api' prefix → metrics live at /api/metrics.
  - job_name: case-service
    static_configs:
      - targets: ["case-service:3004"]
    metrics_path: /api/metrics

  - job_name: integration-hub
    static_configs:
      - targets: ["integration-hub:3005"]
    metrics_path: /api/metrics

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:3006"]
    metrics_path: /api/metrics
