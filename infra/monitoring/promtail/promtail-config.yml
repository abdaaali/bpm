# Promtail: discovers all Docker containers via the daemon socket and ships
# their stdout/stderr to Loki, labelled by compose service + container name.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Strip the leading slash from the container name.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Compose service name (e.g. bpm-orchestrator, case-service).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # stdout vs stderr.
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      # Tag obvious error/warn lines so dashboards can rate them without parsing.
      - match:
          selector: '{job="docker"}'
          stages:
            - regex:
                expression: '(?i)(?P<level>error|warn|fatal)'
            - labels:
                level:
