# TLS-terminating edge reverse proxy — the sole public entry point.
# Terminates HTTPS, redirects HTTP→HTTPS, adds security headers, rate-limits,
# and proxies / → frontend, /api → api-gateway, /realms|/resources|/admin|/js
# → keycloak, and /grafana|/prometheus|/kafka-ui|/minio → the ops tools.
# contractor-frontend (8081) and mobile-pwa (8082) are intentionally NOT
# behind this proxy — they keep their own direct host ports.
#
# Modeled on the qast-apps reference deployment's edge/nginx.conf.

# Rate-limit zones (per client IP). Webhooks and the basic-auth-protected ops
# tools get tighter buckets (the latter to slow credential brute-forcing).
limit_req_zone $binary_remote_addr zone=api:10m     rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ops:10m     rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server_tokens off;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Matches the 50MB multer limit on the attachment upload endpoints
    # (case-service/external-api) — this sat lower than that at 25MB, so
    # anything between 25-50MB would fail here even though every layer behind
    # it (frontend nginx, gateway, the services themselves) allows up to 50MB.
    client_max_body_size 50m;
    limit_conn conn 50;

    # Docker's embedded DNS re-resolves service names after container
    # restarts (30s TTL). Variables in proxy_pass force nginx to use this
    # resolver at request time instead of caching the IP once at startup —
    # without it, a rebuilt/restarted upstream gets a new IP and this proxy
    # keeps dialing the dead old one until it's itself reloaded.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy self-health (no upstream dependency)
    location = /healthz { access_log off; return 200 "ok\n"; }

    # ── API Gateway ────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        set $gw api-gateway:3000;
        proxy_pass http://$gw$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Webhook ingestion (alarms) — tighter rate limit, no JWT (token-guarded)
    location /api/v1/alarms/webhooks/ {
        limit_req zone=webhook burst=10 nodelay;
        set $gw api-gateway:3000;
        proxy_pass http://$gw$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Keycloak ───────────────────────────────────────────────────────────
    # $request_uri (not a literal appended path) preserves OIDC query params
    # (redirect_uri, state, nonce, code_challenge) exactly as sent. Buffers
    # are enlarged for /realms/ — the auth flow sends large Set-Cookie /
    # Location headers that overflow nginx's small defaults.
    location ^~ /realms/ {
        set $kc keycloak:8080;
        proxy_pass              http://$kc$request_uri;
        proxy_set_header        Host                $host;
        proxy_set_header        X-Real-IP           $remote_addr;
        proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto   https;
        proxy_set_header        X-Forwarded-Host    $host;
        proxy_set_header        X-Forwarded-Port    $server_port;
        proxy_set_header        Authorization       $http_authorization;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }

    location ^~ /resources/ {
        set $kc keycloak:8080;
        proxy_pass          http://$kc$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Forwarded-Port    $server_port;
    }

    location ^~ /admin/ {
        set $kc keycloak:8080;
        proxy_pass          http://$kc$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    X-Forwarded-Host    $host;
        proxy_set_header    X-Forwarded-Port    $server_port;
        proxy_set_header    Authorization       $http_authorization;
    }

    location ^~ /js/ {
        set $kc keycloak:8080;
        proxy_pass          http://$kc$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Forwarded-Proto   https;
    }

    # ── Ops tools ──────────────────────────────────────────────────────────
    # Grafana and MinIO keep their OWN login (GRAFANA_ADMIN_PASSWORD /
    # MINIO_ACCESS_KEY+SECRET_KEY) — no basic auth stacked in front of those,
    # it'd just be a second redundant prompt. Prometheus and Kafka UI have NO
    # authentication of their own, so those two get hardened HTTP basic auth
    # (bcrypt, randomly-generated password — see ./gen-htpasswd.sh) plus a
    # tighter rate limit to slow credential brute-forcing. For an extra layer,
    # uncomment the `allow`/`deny` lines below and list your admin IP ranges.

    location ^~ /grafana/ {
        set $gr grafana:3000;
        proxy_pass          http://$gr$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
    }

    location ^~ /prometheus/ {
        limit_req             zone=ops burst=10 nodelay;
        auth_basic             "BPM Ops";
        auth_basic_user_file    /etc/nginx/infra-auth.htpasswd;
        # allow 10.0.0.0/8; deny all;

        set $prom prometheus:9090;
        proxy_pass          http://$prom$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
    }

    location ^~ /kafka-ui/ {
        limit_req             zone=ops burst=10 nodelay;
        auth_basic             "BPM Ops";
        auth_basic_user_file    /etc/nginx/infra-auth.htpasswd;
        # allow 10.0.0.0/8; deny all;

        set $kui kafka-ui:8080;
        proxy_pass          http://$kui$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
    }

    # MinIO console serves at root (/), so /minio/<path> must be rewritten to
    # /<path> before proxying. Repeats header directives because a location
    # that sets its own headers doesn't inherit the server-level block.
    location ^~ /minio/ {
        set $mc minio:9001;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass          http://$mc;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
        proxy_set_header    Accept-Encoding     "";
        sub_filter          '<base href="/"/>' '<base href="/minio/">';
        sub_filter_once     on;
    }

    # Presigned attachment DOWNLOAD URLs (R-22): case-service signs these
    # against MINIO_PUBLIC_ENDPOINT (this edge domain), so the bucket path
    # must resolve here too — proxied straight through to MinIO's S3 API
    # (port 9000, not the console on 9001 used by /minio/ above). Preserves
    # $request_uri untouched since the presigned query string (signature,
    # expiry, etc.) must reach MinIO byte-for-byte.
    location ^~ /bpm-attachments/ {
        set $mn minio:9000;
        proxy_pass          http://$mn$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
    }

    # ── Main Frontend SPA (catch-all) ─────────────────────────────────────
    location / {
        set $fe frontend:80;
        proxy_pass          http://$fe$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   https;
    }
}
