# TLS-terminating edge reverse proxy — the sole public entry point.
# Terminates HTTPS, redirects HTTP→HTTPS, adds security headers, rate-limits,
# and proxies / → frontend and /api → api-gateway. App services and ops UIs are
# never published to the host in prod; only this proxy is.

# Rate-limit zones (per client IP). Webhooks get a tighter bucket.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server_tokens off;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 25m;
    limit_conn conn 50;

    # Proxy self-health (no upstream dependency)
    location = /healthz { access_log off; return 200 "ok\n"; }

    # API → gateway
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Webhook ingestion (alarms) — tighter rate limit, no JWT (token-guarded)
    location /api/v1/alarms/webhooks/ {
        limit_req zone=webhook burst=10 nodelay;
        proxy_pass http://api-gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else → frontend SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
