name: CI/CD

# Build → test → push images → deploy. Adjust REGISTRY and the deploy hosts/secrets
# for your environment. Designed for GitHub Actions; the steps map 1:1 to GitLab CI.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Lint / build / unit tests per service ─────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/org-service
          - services/approval-service
          - services/bpm-orchestrator
          - services/case-service
          - services/integration-hub
          - services/notification-service
          - services/external-api
          - services/api-gateway
          - apps/frontend-portal
          - apps/contractor-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: '${{ matrix.service }}/package-lock.json' }
      - name: Install
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Build (tsc / vite)
        working-directory: ${{ matrix.service }}
        run: npm run build --if-present
      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test --if-present -- --ci --passWithNoTests

  # ── Build & push images (main and version tags only) ──────────────────────
  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: org-service,          context: services/org-service }
          - { name: approval-service,     context: services/approval-service }
          - { name: orchestrator,         context: services/bpm-orchestrator }
          - { name: case-service,         context: services/case-service }
          - { name: integration-hub,      context: services/integration-hub }
          - { name: notification-service, context: services/notification-service }
          - { name: external-api,         context: services/external-api }
          - { name: api-gateway,          context: services/api-gateway }
          - { name: frontend,             context: apps/frontend-portal }
          - { name: contractor-frontend,  context: apps/contractor-portal }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - name: Compute tag
        id: tag
        run: echo "tag=${GITHUB_REF_TYPE == 'tag' && GITHUB_REF_NAME || github.sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.ref_name }}

  # ── Deploy to staging (auto on main) ──────────────────────────────────────
  deploy-staging:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/bpm/infra
            export REGISTRY=ghcr.io/${{ github.repository_owner }} IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose run --rm db-migrate          # controlled, ordered migrations
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

  # ── Deploy to production (version tag + manual approval) ───────────────────
  deploy-prod:
    needs: build-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production      # require approvers in repo → Environments → production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/bpm/infra
            export REGISTRY=ghcr.io/${{ github.repository_owner }} IMAGE_TAG=${{ github.ref_name }}
            docker compose pull
            docker compose run --rm db-migrate
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
