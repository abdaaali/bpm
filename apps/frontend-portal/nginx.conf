server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so upstream hostnames are re-resolved at request
    # time (with variable-based proxy_pass below) instead of being cached once at
    # startup. Without this, a restarted backend gets a new IP and nginx keeps
    # dialing the dead old one -> 502 Bad Gateway until reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Matches the 50MB multer limit already set on both the gateway's and
    # case-service's attachment upload interceptors — without this, nginx's
    # own default (1MB) rejects anything bigger with a 413 before the request
    # ever reaches those services, regardless of what they're configured for.
    client_max_body_size 50m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Keycloak proxy — ^~ prevents the css/js regex rule from intercepting these paths
    location ^~ /realms/ {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:8080$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location ^~ /resources/ {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:8080$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8080;
    }

    location ^~ /js/ {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:8080$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway proxy
    location /api/ {
        set $api_upstream api-gateway;
        proxy_pass http://$api_upstream:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
