server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches external-api's 50MB multer limit on attachment uploads
    # (services/external-api/src/attachments/attachments.controller.ts) —
    # without this, nginx's own default (1MB) rejects anything bigger with a
    # 413 before external-api ever sees the request.
    client_max_body_size 50m;

    # Used by the new /bpm-attachments/ location below (variable-based
    # proxy_pass requires an explicit resolver). Does not affect the
    # existing /api/ext/ location, which still resolves external-api once
    # at startup as before.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy external API
    location /api/ext/ {
        proxy_pass http://external-api:3007/api/ext/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Presigned attachment DOWNLOAD URLs (R-22): external-api signs these
    # against MINIO_PUBLIC_ENDPOINT (this contractor-portal domain), so the
    # bucket path must resolve here too — proxied straight through to
    # MinIO's S3 API. Preserves $request_uri untouched since the presigned
    # query string (signature, expiry, etc.) must reach MinIO byte-for-byte.
    location ^~ /bpm-attachments/ {
        set $mn minio:9000;
        proxy_pass          http://$mn$request_uri;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
