<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ac1900"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Simple crossed-tools mark (wrench + screwdriver), echoing the app's existing HardwareOutlined brand icon -->
  <g stroke="#fff" stroke-width="14" stroke-linecap="round">
    <line x1="52" y1="52" x2="140" y2="140"/>
    <line x1="140" y1="52" x2="52" y2="140"/>
  </g>
  <circle cx="52" cy="52" r="14" fill="#fff"/>
  <circle cx="140" cy="140" r="10" fill="#fff"/>
</svg>
