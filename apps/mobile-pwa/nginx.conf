server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the 50MB multer limit on both proxied backends' attachment
    # uploads (case-service via api-gateway, external-api directly) — field
    # photo uploads are exactly the case this matters for. Without this,
    # nginx's own default (1MB) rejects anything bigger with a 413 before
    # either backend ever sees the request.
    client_max_body_size 50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # BPM platform via the API gateway
    location /api/v1/ { proxy_pass http://api-gateway:3000/api/v1/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    # Contractor portal via external-api
    location /api/ext/ { proxy_pass http://external-api:3007/api/ext/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 60s; }
    # Keycloak (BPM login)
    location /kc/ { proxy_pass http://keycloak:8080/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # Service worker must not be cached (so updates ship)
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { types {} default_type application/manifest+json; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|png|jpg|svg|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
